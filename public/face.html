<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0b7f72">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/people/a90bd0eff95109f6.svg">
  <title>照片瀏覽</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f7;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #647282;
      --line: #dce2e8;
      --accent: #0b7f72;
      --accent-2: #b9462f;
      --chip: #e7f3f1;
      --shadow: 0 12px 34px rgba(21, 31, 43, .14);
    }

    * { box-sizing: border-box; }

    html {
      overscroll-behavior-y: contain;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      letter-spacing: 0;
      overscroll-behavior-y: contain;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 12px 28px;
      overscroll-behavior-y: contain;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -12px 12px;
      padding: 10px 12px;
      background: transparent;
      border-bottom: 0;
      backdrop-filter: none;
    }

    .compact-tools {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }

    .quick-scale {
      flex: 0 0 104px;
      width: 104px;
    }

    input,
    textarea,
    select,
    button {
      min-width: 0;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    input { padding: 0 12px; }
    select { padding: 0 8px; }
    textarea {
      padding: 10px 12px;
      resize: vertical;
    }

    .panel-toggle {
      flex: 0 0 76px;
      width: 76px;
      padding: 0 12px;
      font-weight: 800;
      text-align: center;
    }

    .panel-toggle[aria-expanded="true"] {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .info-panel {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
    }

    .panel-row {
      display: grid;
      grid-template-columns: minmax(0, 136px) minmax(0, 124px) minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .search-input {
      grid-column: 1 / -1;
    }

    .detail-toggle {
      width: 100%;
      padding: 0 12px;
      font-weight: 800;
      text-align: center;
    }

    .detail-toggle[aria-expanded="true"] {
      color: #fff;
      border-color: var(--accent-2);
      background: var(--accent-2);
    }

    .export-button {
      width: 100%;
      padding: 0 12px;
      font-weight: 800;
      text-align: center;
    }

    .detail-filters {
      margin-top: 10px;
    }

    .filter-title {
      margin: 10px 0 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 850;
    }

    .filter-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .check {
      display: inline-flex;
      min-height: 32px;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #eef2f5;
      font-size: 13px;
      line-height: 1.25;
      font-weight: 800;
    }

    .check input {
      width: 16px;
      height: 16px;
      margin: 0;
    }

    .status {
      margin: 8px 2px 0;
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--card-columns, 2), minmax(0, 1fr));
      gap: 10px;
      transform: translate3d(var(--cards-x, 0px), var(--cards-y, 0px), 0) scale(var(--cards-scale, 1));
      transform-origin: 0 0;
      will-change: transform;
    }

    .card-stage {
      overflow: hidden;
      touch-action: pan-y;
    }

    .card-stage.is-zooming {
      touch-action: none;
    }

    .card-stage.is-reordering {
      touch-action: none;
    }

    .person {
      position: relative;
      display: block;
      min-width: 0;
      height: auto;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
      color: inherit;
      box-shadow: 0 8px 22px rgba(21, 31, 43, .08);
      text-align: left;
      cursor: pointer;
      touch-action: pan-y;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      transition: opacity .14s ease, transform .14s ease, box-shadow .14s ease;
    }

    .card-stage.is-reordering .person {
      cursor: grab;
      touch-action: none;
    }

    .card-stage.is-reordering .person:active {
      cursor: grabbing;
    }

    .person.is-dragging {
      opacity: .38;
      pointer-events: none;
      transform: scale(.98);
      box-shadow: none;
    }

    .person.is-drop-target {
      outline: 3px solid rgba(11, 127, 114, .36);
      outline-offset: 3px;
    }

    .drag-ghost {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      margin: 0;
      pointer-events: none;
      opacity: .92;
      transform: translate3d(var(--drag-x, 0px), var(--drag-y, 0px), 0) scale(1.03);
      box-shadow: 0 18px 46px rgba(21, 31, 43, .28);
      transition: none;
      will-change: transform;
    }

    .photo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #f8fafb;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    .meta {
      padding: 9px 10px 10px;
    }

    .name {
      min-width: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .title {
      margin-top: 3px;
      color: var(--accent-2);
      font-size: 14px;
      line-height: 1.3;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .info-line {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .notes {
      margin-top: 18px;
    }

    .notes-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 850;
    }

    .notes-input {
      display: block;
      width: 100%;
      min-height: 92px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.45;
      outline: none;
      resize: vertical;
    }

    .notes-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11, 127, 114, .14);
    }

    .info-image {
      display: block;
      width: 100%;
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafb;
    }

    .empty {
      display: none;
      padding: 40px 12px;
      color: var(--muted);
      text-align: center;
    }

    dialog {
      width: min(calc(100% - 24px), 520px);
      max-height: min(92dvh, 820px);
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
      flex-direction: column;
      overscroll-behavior: contain;
    }

    dialog[open] { display: flex; }

    html.dialog-lock,
    body.dialog-lock {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    dialog::backdrop {
      background: rgba(20, 26, 32, .58);
      backdrop-filter: blur(5px);
    }

    .photo-stage {
      display: block;
      flex: 0 0 auto;
      width: 100%;
      max-height: 46dvh;
      overflow: hidden;
      background: #f8fafb;
      touch-action: none;
      user-select: none;
      cursor: pointer;
    }

    .modal-photo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 46dvh;
      object-fit: contain;
      background: #f8fafb;
      transform: translate3d(var(--photo-x, 0px), var(--photo-y, 0px), 0) scale(var(--photo-scale, 1));
      transform-origin: 0 0;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    .modal-body {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    .modal-body::after {
      content: "";
      display: block;
      height: max(88px, env(safe-area-inset-bottom));
    }

    .modal-head {
      display: block;
    }

    .modal-head > div {
      width: 100%;
    }

    .modal-name {
      display: block;
      width: 100%;
      height: auto;
      min-height: 38px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 28px;
      line-height: 1.1;
      font-weight: 850;
      overflow-wrap: anywhere;
      box-sizing: border-box;
      padding-right: 46px;
    }

    .modal-input:focus,
    .info-lines-input:focus {
      outline: 2px solid rgba(11, 127, 114, .28);
      outline-offset: 2px;
    }

    .modal-input[readonly],
    .info-lines-input[readonly] {
      cursor: pointer;
      -webkit-text-fill-color: currentColor;
    }

    .modal-input.is-editing,
    .info-lines-input.is-editing {
      cursor: text;
    }

    .title.modal-input {
      display: block;
      width: 100%;
      height: auto;
      min-height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 16px;
      line-height: 1.35;
      overflow: hidden;
      resize: none;
    }

    .info-lines-input {
      display: block;
      width: 100%;
      min-height: 72px;
      margin-top: 7px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 16px;
      line-height: 1.35;
      overflow: hidden;
      resize: none;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #eef2f5;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }

    @media (min-width: 760px) {
      .grid { --card-columns: 4; }
    }

    @media (max-width: 720px) {
      .panel-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .check {
        justify-content: center;
      }

      .detail-toggle {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 480px) {
      .compact-tools {
        justify-content: flex-end;
      }

      .panel-toggle {
        flex-basis: 72px;
        width: 72px;
      }

      .panel-row {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar">
      <div class="compact-tools">
        <select id="quickCardScale" class="quick-scale" aria-label="照片縮放">
          <option value="1">100%</option>
          <option value="0.75" selected>75%</option>
          <option value="0.5">50%</option>
          <option value="0.25">25%</option>
        </select>
        <button id="panelToggle" class="panel-toggle" type="button" aria-expanded="false">展開</button>
      </div>
      <section id="infoPanel" class="info-panel" hidden>
        <div class="panel-row">
          <input id="search" class="search-input" type="search" placeholder="搜尋姓名、班別、公司、類別" autocomplete="off">
          <select id="sortMode" aria-label="排序依據">
            <option value="custom" selected>自行排列</option>
            <option value="name">依照名字</option>
            <option value="modified">依修改日期</option>
          </select>
          <select id="sortDirection" aria-label="排序方向">
            <option value="asc" selected>小到大</option>
            <option value="desc">大到小</option>
          </select>
          <select id="cardScale" aria-label="照片縮放">
            <option value="1">照片 100%</option>
            <option value="0.75" selected>照片 75%</option>
            <option value="0.5">照片 50%</option>
            <option value="0.25">照片 25%</option>
          </select>
          <label class="check"><input id="showNamesInput" type="checkbox" checked> 顯示人名</label>
          <button id="detailToggle" class="detail-toggle" type="button" aria-expanded="false">展開詳細分類</button>
          <button id="exportData" class="export-button" type="button">匯出 people.json</button>
        </div>
        <section id="detailFilters" class="detail-filters" hidden></section>
        <div id="status" class="status"></div>
      </section>
    </section>

    <div id="cardStage" class="card-stage">
      <section id="grid" class="grid" aria-live="polite"></section>
      <div id="empty" class="empty">找不到符合的人物</div>
    </div>
  </main>

  <dialog id="dialog">
    <div id="photoStage" class="photo-stage">
      <img id="modalPhoto" class="modal-photo" alt="">
    </div>
    <div class="modal-body">
      <div class="modal-head">
        <div>
          <input id="modalName" class="modal-name modal-input" type="text" autocomplete="off" aria-label="姓名">
          <textarea id="modalTitle" class="title modal-input" rows="1" autocomplete="off" aria-label="職稱"></textarea>
        </div>
        <button class="close" id="close" type="button" aria-label="關閉" autofocus>×</button>
      </div>
      <textarea id="modalInfoLines" class="info-lines-input" autocomplete="off" aria-label="詳細資料"></textarea>
      <div class="notes">
        <label class="notes-label" for="modalNotes">備註</label>
        <textarea id="modalNotes" class="notes-input" rows="4" placeholder="輸入備註"></textarea>
      </div>
      <img id="modalInfoImage" class="info-image" alt="">
    </div>
  </dialog>

  <script>
    let people = [];
    const urlParams = new URLSearchParams(window.location.search);
    const builtInDataVersion = "20260928-people-f5beee97";
    const dataVersion = builtInDataVersion;
    const peopleDataUrl = `people.json?v=${encodeURIComponent(dataVersion)}`;
    const resetStoredOrder = urlParams.get("resetOrder") === "1" || urlParams.get("resetOrder") === dataVersion;

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const cardStage = document.getElementById("cardStage");
    const search = document.getElementById("search");
    const sortMode = document.getElementById("sortMode");
    const sortDirection = document.getElementById("sortDirection");
    const quickCardScale = document.getElementById("quickCardScale");
    const cardScale = document.getElementById("cardScale");
    const panelToggle = document.getElementById("panelToggle");
    const infoPanel = document.getElementById("infoPanel");
    const showNamesInput = document.getElementById("showNamesInput");
    const detailToggle = document.getElementById("detailToggle");
    const detailFilters = document.getElementById("detailFilters");
    const exportData = document.getElementById("exportData");
    const status = document.getElementById("status");
    const dialog = document.getElementById("dialog");
    const photoStage = document.getElementById("photoStage");
    const modalPhoto = document.getElementById("modalPhoto");
    const modalName = document.getElementById("modalName");
    const modalTitle = document.getElementById("modalTitle");
    const modalInfoLines = document.getElementById("modalInfoLines");
    const modalNotes = document.getElementById("modalNotes");
    const modalInfoImage = document.getElementById("modalInfoImage");
    const closeButton = document.getElementById("close");
    let showNames = true;
    let reorderMode = false;
    let activePersonId = "";
    let lockedScrollY = 0;
    let modalTouchStartY = 0;
    let pageTouchStartY = 0;
    let dragState = null;
    const notesKey = "faceCardsNotes:v1";
    const editsKey = "faceCardsPersonEdits:v1";
    const orderKey = "faceCardsCustomOrder:v1";
    const sortStateKey = "faceCardsSortState:v1";
    const storage = {
      getJSON(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch {
          return fallback;
        }
      },
      setJSON(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {}
      },
      remove(key) {
        try {
          localStorage.removeItem(key);
        } catch {}
      },
    };
    if (resetStoredOrder) {
      storage.remove(orderKey);
      storage.remove(sortStateKey);
    }
    const savedNotes = (() => {
      const parsed = storage.getJSON(notesKey, {});
      return parsed && typeof parsed === "object" ? parsed : {};
    })();
    const savedEdits = (() => {
      const parsed = storage.getJSON(editsKey, {});
      return parsed && typeof parsed === "object" ? parsed : {};
    })();
    let customOrder = (() => {
      const parsed = storage.getJSON(orderKey, []);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return [];
      if (parsed.version !== dataVersion || !Array.isArray(parsed.order)) return [];
      return parsed.order.filter((id) => typeof id === "string");
    })();
    const savedSortState = (() => {
      const parsed = storage.getJSON(sortStateKey, {});
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
      return parsed.version === dataVersion ? parsed : {};
    })();
    const filterGroups = [
      { key: "detailCategories", label: "類別", values: ["EMBA", "113", "114", "扶輪社"] },
    ];
    const selectedFilters = Object.fromEntries(filterGroups.map((group) => [group.key, new Set()]));
    const photoPointers = new Map();
    let photoZoom = { scale: 1, x: 0, y: 0 };
    let photoGesture = null;
    let photoGestureMoved = false;
    const cardPointers = new Map();
    let cardZoom = { scale: 0.75, x: 0, y: 0 };
    let cardGesture = null;
    let cardGestureMoved = false;
    let cardLayoutFrame = 0;
    let gridShiftFrame = 0;
    let dragAutoScrollFrame = 0;
    let suppressCardClickUntil = 0;
    const dragHoldDelay = 500;
    const cardScaleSteps = [1, 0.75, 0.5, 0.25];
    const defaultCardScale = 0.75;


    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function constrainPhotoZoom(zoom) {
      if (zoom.scale <= 1) return { scale: 1, x: 0, y: 0 };
      const stageWidth = photoStage.clientWidth;
      const stageHeight = photoStage.clientHeight;
      const imageWidth = modalPhoto.offsetWidth * zoom.scale;
      const imageHeight = modalPhoto.offsetHeight * zoom.scale;
      const minX = Math.min(0, stageWidth - imageWidth);
      const minY = Math.min(0, stageHeight - imageHeight);
      return {
        scale: zoom.scale,
        x: clamp(zoom.x, minX, 0),
        y: clamp(zoom.y, minY, 0),
      };
    }

    function applyPhotoZoom() {
      photoZoom = constrainPhotoZoom(photoZoom);
      modalPhoto.style.setProperty("--photo-scale", photoZoom.scale);
      modalPhoto.style.setProperty("--photo-x", `${photoZoom.x}px`);
      modalPhoto.style.setProperty("--photo-y", `${photoZoom.y}px`);
    }

    function resetPhotoZoom() {
      photoPointers.clear();
      photoGesture = null;
      photoGestureMoved = false;
      photoZoom = { scale: 1, x: 0, y: 0 };
      applyPhotoZoom();
    }

    function stagePoint(event) {
      const rect = photoStage.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function pointerList() {
      return [...photoPointers.values()];
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function midpoint(a, b) {
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    function startPhotoGesture() {
      const points = pointerList();
      if (points.length === 1) {
        photoGesture = { mode: "pan", start: points[0], base: { ...photoZoom } };
      } else if (points.length >= 2) {
        photoGesture = {
          mode: "pinch",
          startDistance: distance(points[0], points[1]) || 1,
          startCenter: midpoint(points[0], points[1]),
          base: { ...photoZoom },
        };
      }
    }

    function updatePhotoGesture() {
      const points = pointerList();
      if (!photoGesture || !points.length) return;
      if (photoGesture.mode === "pan" && points.length === 1 && photoZoom.scale > 1) {
        const dx = points[0].x - photoGesture.start.x;
        const dy = points[0].y - photoGesture.start.y;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) photoGestureMoved = true;
        photoZoom = {
          scale: photoGesture.base.scale,
          x: photoGesture.base.x + dx,
          y: photoGesture.base.y + dy,
        };
        applyPhotoZoom();
      } else if (photoGesture.mode === "pinch" && points.length >= 2) {
        const center = midpoint(points[0], points[1]);
        const nextScale = clamp(photoGesture.base.scale * (distance(points[0], points[1]) / photoGesture.startDistance), 1, 5);
        const ratio = nextScale / photoGesture.base.scale;
        photoGestureMoved = true;
        photoZoom = {
          scale: nextScale,
          x: center.x - (photoGesture.startCenter.x - photoGesture.base.x) * ratio,
          y: center.y - (photoGesture.startCenter.y - photoGesture.base.y) * ratio,
        };
        applyPhotoZoom();
      }
    }

    function constrainCardZoom(zoom) {
      let scale = Number(zoom.scale) || 1;
      if (Math.abs(scale - 1) < 0.03) {
        scale = 1;
      } else if (scale < 1) {
        scale = closestCardScale(scale);
      } else {
        scale = clamp(scale, 1, 2);
      }
      if (scale === 1) return { scale: 1, x: 0, y: 0 };
      if (scale < 1) {
        return { scale, x: 0, y: 0 };
      }
      const stageWidth = cardStage.clientWidth;
      const stageHeight = cardStage.clientHeight;
      const gridWidth = grid.offsetWidth * scale;
      const gridHeight = grid.offsetHeight * scale;
      const minX = Math.min(0, stageWidth - gridWidth);
      const minY = Math.min(0, stageHeight - gridHeight);
      return {
        scale,
        x: clamp(zoom.x, minX, 0),
        y: clamp(zoom.y, minY, 0),
      };
    }

    function baseCardColumns() {
      return window.matchMedia("(min-width: 760px)").matches ? 4 : 2;
    }

    function cardColumnsForScale(scale) {
      const baseColumns = baseCardColumns();
      if (scale >= 1) return baseColumns;
      const shrinkStep = closestCardScale(scale);
      const extraColumnsByStep = { 0.75: 1, 0.5: 2, 0.25: 3 };
      return baseColumns + (extraColumnsByStep[shrinkStep] || 0);
    }

    function closestCardScale(scale) {
      const clampedScale = clamp(Number(scale) || 1, 0.25, 1);
      return cardScaleSteps.reduce((best, value) => (
        Math.abs(value - clampedScale) < Math.abs(best - clampedScale) ? value : best
      ), 1);
    }

    function cardGestureScale(rawScale) {
      const scale = Number(rawScale) || 1;
      if (scale < 1) return closestCardScale(scale);
      return clamp(scale, 1, 2);
    }

    function applyCardZoom() {
      cardZoom = constrainCardZoom(cardZoom);
      const visualScale = cardZoom.scale < 1 ? 1 : cardZoom.scale;
      grid.style.setProperty("--card-columns", cardColumnsForScale(cardZoom.scale));
      grid.style.setProperty("--cards-scale", visualScale);
      grid.style.setProperty("--cards-x", `${cardZoom.x}px`);
      grid.style.setProperty("--cards-y", `${cardZoom.y}px`);
      cardStage.classList.toggle("is-zooming", cardZoom.scale > 1);
      const selectedScale = String(closestCardScale(cardZoom.scale));
      quickCardScale.value = selectedScale;
      cardScale.value = selectedScale;
    }

    function resetCardZoom() {
      cardPointers.clear();
      cardGesture = null;
      cardZoom = { scale: defaultCardScale, x: 0, y: 0 };
      applyCardZoom();
    }

    function setCardScale(value) {
      const scale = closestCardScale(value);
      cardPointers.clear();
      cardGesture = null;
      cardZoom = { scale, x: 0, y: 0 };
      applyCardZoom();
    }

    function refreshCardLayout() {
      if (cardLayoutFrame) cancelAnimationFrame(cardLayoutFrame);
      cardLayoutFrame = requestAnimationFrame(() => {
        cardLayoutFrame = 0;
        cardPointers.clear();
        cardGesture = null;
        cardZoom = { ...cardZoom, x: 0, y: 0 };
        applyCardZoom();
      });
    }

    function cardPoint(event) {
      const rect = cardStage.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function cardPointerList() {
      return [...cardPointers.values()];
    }

    function startCardGesture() {
      const points = cardPointerList();
      if (points.length === 1) {
        cardGesture = { mode: "pan", start: points[0], base: { ...cardZoom } };
      } else if (points.length >= 2) {
        cardGesture = {
          mode: "pinch",
          startDistance: distance(points[0], points[1]) || 1,
          startCenter: midpoint(points[0], points[1]),
          base: { ...cardZoom },
        };
      }
    }

    function updateCardGesture() {
      const points = cardPointerList();
      if (!cardGesture || !points.length) return;
      if (cardGesture.mode === "pan" && points.length === 1 && cardZoom.scale > 1) {
        const dx = points[0].x - cardGesture.start.x;
        const dy = points[0].y - cardGesture.start.y;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) cardGestureMoved = true;
        cardZoom = {
          scale: cardGesture.base.scale,
          x: cardGesture.base.x + dx,
          y: cardGesture.base.y + dy,
        };
        applyCardZoom();
      } else if (cardGesture.mode === "pinch" && points.length >= 2) {
        const center = midpoint(points[0], points[1]);
        const nextScale = cardGestureScale(cardGesture.base.scale * (distance(points[0], points[1]) / cardGesture.startDistance));
        const ratio = nextScale / cardGesture.base.scale;
        cardGestureMoved = true;
        cardZoom = {
          scale: nextScale,
          x: center.x - (cardGesture.startCenter.x - cardGesture.base.x) * ratio,
          y: center.y - (cardGesture.startCenter.y - cardGesture.base.y) * ratio,
        };
        applyCardZoom();
      }
    }

    function searchable(person) {
      return [
        person.name,
        person.title,
        person.id,
        person.category,
        person.className,
        ...(person.detailCategories || []),
        ...(person.clubs || []),
        ...(person.infoLines || []),
        person.notes || "",
        savedNotes[person.id] || "",
      ].join(" ").toLowerCase();
    }

    function valuesFor(group) {
      const priority = group.values || [];
      const values = [...new Set(people.flatMap((person) => person[group.key] || []))];
      const rest = values
        .filter((value) => !priority.includes(value))
        .sort((a, b) => a.localeCompare(b, "zh-Hant"));
      return [...priority.filter((value) => values.includes(value)), ...rest];
    }

    function filterOption(group, value) {
      const checked = selectedFilters[group.key].has(value) ? " checked" : "";
      return `<label class="check"><input type="checkbox" data-filter-key="${esc(group.key)}" value="${esc(value)}"${checked}> ${esc(value)}</label>`;
    }

    function renderDetailFilters() {
      detailFilters.innerHTML = filterGroups.map((group) => {
        const options = valuesFor(group).map((value) => filterOption(group, value)).join("");
        return `<section><div class="filter-title">${esc(group.label)}</div><div class="filter-options">${options}</div></section>`;
      }).join("");
    }

    function card(person, index) {
      const imageSrc = person.thumbnailData || person.imageData;
      const loading = index < 8 ? "eager" : "lazy";
      const fetchPriority = index < 4 ? "high" : "auto";
      return `
        <button class="person" type="button" data-id="${esc(person.id)}" aria-label="${esc(person.name)}，可拖曳調整順序">
          <img class="photo" src="${esc(imageSrc)}" data-full-src="${esc(person.imageData)}" alt="${esc(person.name)}" loading="${loading}" decoding="async" fetchpriority="${fetchPriority}">
          ${showNames ? `<div class="meta">
            <div class="name">${esc(person.name)}</div>
          </div>` : ""}
        </button>
      `;
    }

    function esc(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function personSelector(id) {
      return `.person[data-id="${String(id || "").replaceAll("\\", "\\\\").replaceAll('"', '\\"')}"]`;
    }

    function splitLines(value) {
      return String(value || "").split(/\n+/).map((line) => line.trim()).filter(Boolean);
    }

    function applySavedEdits() {
      for (const person of people) {
        if (typeof person.notes === "string" && savedNotes[person.id] === undefined) {
          savedNotes[person.id] = person.notes;
        }
        const edit = savedEdits[person.id];
        if (!edit) continue;
        if (typeof edit.name === "string") person.name = edit.name;
        if (typeof edit.title === "string") person.title = edit.title;
        if (Array.isArray(edit.infoLines)) person.infoLines = edit.infoLines.filter(Boolean);
      }
    }

    function saveActivePersonEdits() {
      if (!activePersonId) return;
      const person = people.find((item) => item.id === activePersonId);
      if (!person) return;
      person.name = modalName.value.trim() || person.id;
      person.title = modalTitle.value.trim();
      person.infoLines = splitLines(modalInfoLines.value);
      savedEdits[person.id] = {
        name: person.name,
        title: person.title,
        infoLines: person.infoLines,
        modifiedAt: Date.now(),
      };
      storage.setJSON(editsKey, savedEdits);
      modalPhoto.alt = person.name;
      if (person.infoImageData) modalInfoImage.alt = `${person.name} 資料`;
      render();
    }

    function editableFields() {
      return [modalName, modalTitle, modalInfoLines];
    }

    function lockEditFields() {
      editableFields().forEach((field) => {
        field.classList.remove("is-editing");
      });
    }

    function unlockEditField(field) {
      if (!activePersonId) return;
      field.classList.add("is-editing");
    }

    function focusEditField(field) {
      unlockEditField(field);
      field.focus({ preventScroll: true });
      const end = field.value.length;
      if (typeof field.setSelectionRange === "function") field.setSelectionRange(end, end);
    }

    function fitTextAreaHeight(field) {
      field.style.height = "auto";
      field.style.height = `${field.scrollHeight}px`;
    }

    function fitEditableTextHeights() {
      fitTextAreaHeight(modalTitle);
      fitTextAreaHeight(modalInfoLines);
    }

    function fitInfoLinesHeight() {
      fitEditableTextHeights();
    }

    function fitInfoLinesAfterPaint() {
      requestAnimationFrame(() => {
        fitInfoLinesHeight();
        requestAnimationFrame(fitInfoLinesHeight);
      });
    }

    function normalizedCustomOrder() {
      const ids = new Set(people.map((person) => person.id));
      const ordered = customOrder.filter((id) => ids.has(id));
      for (const person of [...people].sort((a, b) => (a.inputOrder || 0) - (b.inputOrder || 0))) {
        if (!ordered.includes(person.id)) ordered.push(person.id);
      }
      return ordered;
    }

    function saveCustomOrder() {
      if (!people.length) return;
      customOrder = normalizedCustomOrder();
      storage.setJSON(orderKey, {
        version: dataVersion,
        order: customOrder,
      });
      saveSortState();
    }

    function saveSortState() {
      storage.setJSON(sortStateKey, {
        version: dataVersion,
        mode: sortMode.value,
        direction: sortDirection.value,
      });
    }

    function restoreSortState() {
      if (customOrder.length) {
        sortMode.value = "custom";
        sortDirection.value = "asc";
        saveSortState();
        return;
      }
      if (savedSortState.mode && [...sortMode.options].some((option) => option.value === savedSortState.mode)) {
        sortMode.value = savedSortState.mode;
      }
      if (savedSortState.direction && [...sortDirection.options].some((option) => option.value === savedSortState.direction)) {
        sortDirection.value = savedSortState.direction;
      }
    }

    function customOrderIndex(person) {
      const index = normalizedCustomOrder().indexOf(person.id);
      return index === -1 ? Number.MAX_SAFE_INTEGER : index;
    }

    function modifiedTime(person) {
      const edit = savedEdits[person.id];
      if (edit && Number.isFinite(edit.modifiedAt)) return edit.modifiedAt;
      if (Number.isFinite(person.modifiedAt)) return person.modifiedAt;
      return Number(person.inputOrder || 0);
    }

    function sortRows(rows) {
      const direction = sortDirection.value === "desc" ? -1 : 1;
      const mode = sortMode.value;
      const sorted = [...rows];
      if (mode === "name") {
        sorted.sort((a, b) => direction * a.name.localeCompare(b.name, "zh-Hant"));
      } else if (mode === "modified") {
        sorted.sort((a, b) => direction * (modifiedTime(a) - modifiedTime(b)));
      } else {
        sorted.sort((a, b) => direction * (customOrderIndex(a) - customOrderIndex(b)));
      }
      return sorted;
    }

    function captureCurrentOrderAsCustom() {
      customOrder = sortRows([...people]).map((person) => person.id);
      sortMode.value = "custom";
      sortDirection.value = "asc";
      saveCustomOrder();
    }

    function filteredPeople() {
      const q = search.value.trim().toLowerCase();
      let rows = people.filter((person) => {
        const matchesText = !q || searchable(person).includes(q);
        const matchesDetails = filterGroups.every((group) => {
          const selected = selectedFilters[group.key];
          const values = Array.isArray(person[group.key]) ? person[group.key] : [person[group.key]].filter(Boolean);
          return selected.size === 0 || [...selected].every((value) => values.includes(value));
        });
        return matchesText && matchesDetails;
      });
      return sortRows(rows);
    }

    function exportPeopleData() {
      const orderedIds = normalizedCustomOrder();
      const byId = new Map(people.map((person) => [person.id, person]));
      return orderedIds.map((id, index) => {
        const person = byId.get(id);
        const exported = { ...person };
        const edit = savedEdits[id];
        if (edit) {
          if (typeof edit.name === "string") exported.name = edit.name;
          if (typeof edit.title === "string") exported.title = edit.title;
          if (Array.isArray(edit.infoLines)) exported.infoLines = edit.infoLines.filter(Boolean);
        }
        const note = savedNotes[id] ?? exported.notes;
        if (typeof note === "string" && note.trim()) exported.notes = note.trim();
        else delete exported.notes;
        exported.inputOrder = index + 1;
        return exported;
      });
    }

    function triggerPeopleJsonDownload(blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "people.json";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function downloadPeopleJson() {
      const blob = new Blob([JSON.stringify(exportPeopleData())], { type: "application/json" });
      const file = typeof File === "function"
        ? new File([blob], "people.json", { type: "application/json" })
        : null;
      if (file && navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: "people.json",
          });
          status.textContent = `已匯出 people.json，共 ${people.length} 筆`;
          return;
        } catch (error) {
          if (error?.name === "AbortError") return;
        }
      }
      triggerPeopleJsonDownload(blob);
      status.textContent = `已匯出 people.json，共 ${people.length} 筆`;
    }

    function render() {
      const rows = filteredPeople();
      grid.innerHTML = rows.map(card).join("");
      empty.style.display = rows.length ? "none" : "block";
      const selectedCount = filterGroups.reduce((total, group) => total + selectedFilters[group.key].size, 0);
      const detailText = selectedCount ? `，詳細分類 ${selectedCount} 項` : "";
      const sortText = sortMode.value === "custom" ? "自行排列" : sortMode.value === "name" ? "依名字" : "依修改日期";
      const directionText = sortDirection.value === "desc" ? "大到小" : "小到大";
      const reorderText = reorderMode ? "，長按排序中" : "";
      status.textContent = `已載入 ${people.length} 筆，目前顯示 ${rows.length} 筆，${showNames ? "顯示名字" : "隱藏名字"}，${sortText}${directionText}${detailText}${reorderText}`;
      applyCardZoom();
    }

    function setReorderMode(enabled) {
      reorderMode = Boolean(enabled);
      cardStage.classList.toggle("is-reordering", reorderMode);
    }

    function show(person) {
      activePersonId = person.id;
      resetPhotoZoom();
      modalPhoto.src = person.imageData;
      modalPhoto.alt = person.name;
      modalName.value = person.name;
      modalTitle.value = person.title || "";
      modalInfoLines.value = (person.infoLines || []).join("\n");
      lockEditFields();
      modalNotes.value = savedNotes[person.id] || "";
      if (person.infoImageData) {
        modalInfoImage.src = person.infoImageData;
        modalInfoImage.alt = `${person.name} 資料`;
        modalInfoImage.style.display = "block";
      } else {
        modalInfoImage.removeAttribute("src");
        modalInfoImage.style.display = "none";
      }
      lockPageScroll();
      dialog.showModal();
      fitInfoLinesAfterPaint();
      requestAnimationFrame(() => closeButton.focus({ preventScroll: true }));
    }

    function lockPageScroll() {
      if (document.body.classList.contains("dialog-lock")) return;
      lockedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
      document.documentElement.classList.add("dialog-lock");
      document.body.classList.add("dialog-lock");
      document.body.style.position = "fixed";
      document.body.style.top = `-${lockedScrollY}px`;
      document.body.style.left = "0";
      document.body.style.right = "0";
      document.body.style.width = "100%";
    }

    function unlockPageScroll() {
      if (!document.body.classList.contains("dialog-lock")) return;
      document.documentElement.classList.remove("dialog-lock");
      document.body.classList.remove("dialog-lock");
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.left = "";
      document.body.style.right = "";
      document.body.style.width = "";
      window.scrollTo(0, lockedScrollY);
    }

    function handleDialogTouchStart(event) {
      if (!dialog.open || event.touches.length !== 1) return;
      modalTouchStartY = event.touches[0].clientY;
    }

    function handleDialogTouchMove(event) {
      if (!dialog.open || event.touches.length !== 1) return;
      const scrollArea = event.target.closest(".modal-body");
      if (!scrollArea) {
        event.preventDefault();
        return;
      }
      const deltaY = event.touches[0].clientY - modalTouchStartY;
      const atTop = scrollArea.scrollTop <= 0;
      const atBottom = Math.ceil(scrollArea.scrollTop + scrollArea.clientHeight) >= scrollArea.scrollHeight;
      if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) event.preventDefault();
    }

    function handlePageTouchStart(event) {
      if (event.touches.length === 1) pageTouchStartY = event.touches[0].clientY;
    }

    function handlePageTouchMove(event) {
      if (dialog.open) return;
      if (event.touches.length >= 2 && event.target.closest?.("#cardStage")) {
        event.preventDefault();
        return;
      }
      if (event.touches.length !== 1) return;
      const deltaY = event.touches[0].clientY - pageTouchStartY;
      const scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
      const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      if ((scrollTop <= 0 && deltaY > 0) || (scrollTop >= maxScroll - 1 && deltaY < 0)) {
        event.preventDefault();
      }
    }

    function clearCardDropTargets() {
      grid.querySelectorAll(".person.is-drop-target").forEach((button) => {
        button.classList.remove("is-drop-target");
      });
    }

    function clearCardDragState() {
      if (!dragState) return;
      if (dragState.holdTimer) clearTimeout(dragState.holdTimer);
      stopDragAutoScroll();
      const source = grid.querySelector(personSelector(dragState.id));
      if (source) source.classList.remove("is-dragging");
      if (dragState.ghost) dragState.ghost.remove();
      clearCardDropTargets();
      dragState = null;
    }

    function reorderCustomOrder(dragId, targetId) {
      if (!dragId || !targetId || dragId === targetId) return false;
      normalizedCustomOrder();
      const nextOrder = [...customOrder];
      const from = nextOrder.indexOf(dragId);
      let to = nextOrder.indexOf(targetId);
      if (from === -1 || to === -1) return false;
      nextOrder.splice(from, 1);
      nextOrder.splice(to, 0, dragId);
      customOrder = nextOrder;
      sortMode.value = "custom";
      sortDirection.value = "asc";
      saveCustomOrder();
      return true;
    }

    function moveDragGhost(state, x, y) {
      if (!state.ghost) return;
      state.ghost.style.setProperty("--drag-x", `${x - state.offsetX}px`);
      state.ghost.style.setProperty("--drag-y", `${y - state.offsetY}px`);
    }

    function stopDragAutoScroll() {
      if (dragAutoScrollFrame) cancelAnimationFrame(dragAutoScrollFrame);
      dragAutoScrollFrame = 0;
      if (dragState) dragState.autoScrollSpeed = 0;
    }

    function dragAutoScrollSpeed(clientY) {
      const edge = Math.min(96, Math.max(64, window.innerHeight * 0.16));
      const maxSpeed = 22;
      if (clientY < edge) {
        return -Math.ceil(((edge - clientY) / edge) * maxSpeed);
      }
      if (clientY > window.innerHeight - edge) {
        return Math.ceil(((clientY - (window.innerHeight - edge)) / edge) * maxSpeed);
      }
      return 0;
    }

    function stepDragAutoScroll() {
      dragAutoScrollFrame = 0;
      if (!dragState?.dragging || !dragState.autoScrollSpeed) return;
      const before = window.scrollY || document.documentElement.scrollTop || 0;
      window.scrollBy(0, dragState.autoScrollSpeed);
      const after = window.scrollY || document.documentElement.scrollTop || 0;
      if (after !== before) previewCardDrop();
      if (dragState?.dragging && dragState.autoScrollSpeed) {
        dragAutoScrollFrame = requestAnimationFrame(stepDragAutoScroll);
      }
    }

    function updateDragAutoScroll(clientY) {
      if (!dragState?.dragging) return;
      dragState.autoScrollSpeed = dragAutoScrollSpeed(clientY);
      if (dragState.autoScrollSpeed && !dragAutoScrollFrame) {
        dragAutoScrollFrame = requestAnimationFrame(stepDragAutoScroll);
      }
      if (!dragState.autoScrollSpeed) stopDragAutoScroll();
    }

    function makeDragGhost(button, x, y) {
      const rect = button.getBoundingClientRect();
      const ghost = button.cloneNode(true);
      ghost.classList.remove("is-dragging", "is-drop-target");
      ghost.classList.add("drag-ghost");
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${rect.height}px`;
      document.body.appendChild(ghost);
      return {
        ghost,
        offsetX: x - rect.left,
        offsetY: y - rect.top,
      };
    }

    function gridOrderFromDom() {
      return [...grid.querySelectorAll(".person")].map((button) => button.dataset.id).filter(Boolean);
    }

    function gridRects() {
      return new Map([...grid.querySelectorAll(".person")].map((button) => [
        button.dataset.id,
        button.getBoundingClientRect(),
      ]));
    }

    function prepareGridShift() {
      if (gridShiftFrame) {
        cancelAnimationFrame(gridShiftFrame);
        gridShiftFrame = 0;
      }
      const before = gridRects();
      for (const button of grid.querySelectorAll(".person:not(.is-dragging)")) {
        button.style.transition = "none";
        button.style.transform = "";
      }
      grid.getBoundingClientRect();
      return before;
    }

    function animateGridShift(beforeRects) {
      const moving = [...grid.querySelectorAll(".person:not(.is-dragging)")];
      for (const button of moving) {
        const before = beforeRects.get(button.dataset.id);
        if (!before) continue;
        const after = button.getBoundingClientRect();
        const dx = before.left - after.left;
        const dy = before.top - after.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
        button.style.transition = "none";
        button.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
      }
      gridShiftFrame = requestAnimationFrame(() => {
        gridShiftFrame = 0;
        for (const button of moving) {
          if (!button.style.transform) continue;
          button.style.transition = "transform .28s cubic-bezier(.2, .7, .2, 1), opacity .14s ease, box-shadow .14s ease";
          button.style.transform = "";
        }
      });
    }

    function dragFocusPoint(state) {
      return {
        x: state.currentX - state.offsetX + state.sourceWidth / 2,
        y: state.currentY - state.offsetY + state.sourceHeight / 2,
      };
    }

    function pointInDropZone(point, rect) {
      const margin = Math.max(24, Math.min(rect.width, rect.height) * .18);
      return (
        point.x >= rect.left - margin &&
        point.x <= rect.right + margin &&
        point.y >= rect.top - margin &&
        point.y <= rect.bottom + margin
      );
    }

    function dragTargetFromPoint(state) {
      const point = dragFocusPoint(state);
      const currentTarget = state.targetId && state.targetId !== state.id
        ? grid.querySelector(personSelector(state.targetId))
        : null;
      if (currentTarget && pointInDropZone(point, currentTarget.getBoundingClientRect())) {
        return currentTarget;
      }
      let bestTarget = null;
      let bestDistance = Infinity;
      for (const target of grid.querySelectorAll(".person:not(.is-dragging)")) {
        if (target.dataset.id === state.id) continue;
        const rect = target.getBoundingClientRect();
        if (!pointInDropZone(point, rect)) continue;
        const dx = point.x - (rect.left + rect.width / 2);
        const dy = point.y - (rect.top + rect.height / 2);
        const distance = dx * dx + dy * dy;
        if (distance < bestDistance) {
          bestDistance = distance;
          bestTarget = target;
        }
      }
      return bestTarget;
    }

    function previewCardDrop() {
      if (!dragState) return;
      const target = dragTargetFromPoint(dragState);
      const nextTargetId = target?.dataset.id || dragState.id;
      if (dragState.targetId === nextTargetId) return;
      dragState.targetId = nextTargetId;
      clearCardDropTargets();
      if (target) target.classList.add("is-drop-target");
    }

    function beginFloatingCardDrag() {
      if (!dragState || dragState.dragging) return;
      if (dragState.holdTimer) {
        clearTimeout(dragState.holdTimer);
        dragState.holdTimer = 0;
      }
      const source = grid.querySelector(personSelector(dragState.id));
      if (!source) return;
      dragState.dragging = true;
      setReorderMode(true);
      cardGestureMoved = true;
      cardPointers.delete(dragState.pointerId);
      cardGesture = null;
      captureCurrentOrderAsCustom();
      sortMode.value = "custom";
      sortDirection.value = "asc";
      const ghost = makeDragGhost(source, dragState.currentX, dragState.currentY);
      dragState.ghost = ghost.ghost;
      dragState.offsetX = ghost.offsetX;
      dragState.offsetY = ghost.offsetY;
      dragState.sourceWidth = source.getBoundingClientRect().width;
      dragState.sourceHeight = source.getBoundingClientRect().height;
      source.classList.add("is-dragging");
      moveDragGhost(dragState, dragState.currentX, dragState.currentY);
      if (typeof grid.setPointerCapture === "function") {
        try {
          grid.setPointerCapture(dragState.pointerId);
        } catch {}
      }
    }

    function startCardDrag(event) {
      const button = event.target.closest(".person");
      if (!button || dialog.open || (event.button && event.button !== 0)) return;
      if (dragState && dragState.pointerId !== event.pointerId) {
        clearCardDragState();
        return;
      }
      dragState = {
        pointerId: event.pointerId,
        id: button.dataset.id,
        targetId: button.dataset.id,
        startX: event.clientX,
        startY: event.clientY,
        currentX: event.clientX,
        currentY: event.clientY,
        dragging: false,
      };
      dragState.holdTimer = setTimeout(beginFloatingCardDrag, dragHoldDelay);
    }

    function moveCardDrag(event) {
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      dragState.currentX = event.clientX;
      dragState.currentY = event.clientY;
      const moved = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
      if (!dragState.dragging) {
        if (moved > 10) clearCardDragState();
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      moveDragGhost(dragState, event.clientX, event.clientY);
      previewCardDrop();
      updateDragAutoScroll(event.clientY);
    }

    function finishCardDrag(event) {
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      const state = dragState;
      const didDrag = state.dragging;
      if (typeof grid.releasePointerCapture === "function") {
        try {
          grid.releasePointerCapture(event.pointerId);
        } catch {}
      }
      if (didDrag) {
        reorderCustomOrder(state.id, state.targetId);
      }
      clearCardDragState();
      if (didDrag) setReorderMode(false);
      if (didDrag) render();
      if (didDrag) {
        cardGestureMoved = true;
        suppressCardClickUntil = Date.now() + 350;
      }
    }

    function cancelCardDrag(event) {
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      const didDrag = dragState.dragging;
      clearCardDragState();
      if (didDrag) {
        setReorderMode(false);
        cardGestureMoved = true;
        suppressCardClickUntil = Date.now() + 250;
      }
    }

    grid.addEventListener("pointerdown", startCardDrag);
    grid.addEventListener("pointermove", moveCardDrag);
    grid.addEventListener("pointerup", finishCardDrag);
    grid.addEventListener("pointercancel", cancelCardDrag);
    grid.addEventListener("touchmove", (event) => {
      if (dragState?.dragging) event.preventDefault();
    }, { passive: false });
    grid.addEventListener("contextmenu", (event) => {
      if (event.target.closest(".person")) event.preventDefault();
    });
    grid.addEventListener("click", (event) => {
      if (Date.now() < suppressCardClickUntil) {
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (cardGestureMoved) {
        cardGestureMoved = false;
        return;
      }
      const button = event.target.closest(".person");
      if (!button) return;
      const person = people.find((item) => item.id === button.dataset.id);
      if (person) show(person);
    });

    modalNotes.addEventListener("input", () => {
      if (!activePersonId) return;
      const value = modalNotes.value.trim();
      if (value) savedNotes[activePersonId] = value;
      else delete savedNotes[activePersonId];
      storage.setJSON(notesKey, savedNotes);
      const person = people.find((item) => item.id === activePersonId);
      if (person) {
        if (value) person.notes = value;
        else delete person.notes;
      }
    });
    modalName.addEventListener("input", saveActivePersonEdits);
    modalTitle.addEventListener("input", () => {
      fitEditableTextHeights();
      saveActivePersonEdits();
    });
    modalInfoLines.addEventListener("input", () => {
      fitInfoLinesHeight();
      saveActivePersonEdits();
    });
    editableFields().forEach((field) => {
      field.addEventListener("pointerdown", () => unlockEditField(field));
      field.addEventListener("touchstart", () => unlockEditField(field), { passive: true });
      field.addEventListener("click", () => focusEditField(field));
      field.addEventListener("blur", () => {
        field.classList.remove("is-editing");
      });
    });
    closeButton.addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
    dialog.addEventListener("close", unlockPageScroll);
    dialog.addEventListener("touchstart", handleDialogTouchStart, { passive: true });
    dialog.addEventListener("touchmove", handleDialogTouchMove, { passive: false });
    document.addEventListener("touchstart", handlePageTouchStart, { passive: true });
    document.addEventListener("touchmove", handlePageTouchMove, { passive: false });
    search.addEventListener("input", render);
    sortMode.addEventListener("change", () => {
      saveSortState();
      render();
    });
    sortDirection.addEventListener("change", () => {
      saveSortState();
      render();
    });
    window.addEventListener("pagehide", () => {
      if (customOrder.length) saveCustomOrder();
      else saveSortState();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        if (customOrder.length) saveCustomOrder();
        else saveSortState();
      }
    });
    window.addEventListener("resize", () => {
      if (dialog.open) fitInfoLinesAfterPaint();
    });
    quickCardScale.addEventListener("change", () => setCardScale(quickCardScale.value));
    cardScale.addEventListener("change", () => setCardScale(cardScale.value));
    panelToggle.addEventListener("click", () => {
      const willOpen = infoPanel.hidden;
      infoPanel.hidden = !willOpen;
      panelToggle.setAttribute("aria-expanded", String(willOpen));
      panelToggle.textContent = willOpen ? "收合" : "展開";
      if (!willOpen) {
        detailFilters.hidden = true;
        detailToggle.setAttribute("aria-expanded", "false");
        detailToggle.textContent = "展開詳細分類";
      }
    });
    showNamesInput.addEventListener("change", () => {
      showNames = showNamesInput.checked;
      render();
    });
    detailToggle.addEventListener("click", () => {
      const willOpen = detailFilters.hidden;
      detailFilters.hidden = !willOpen;
      detailToggle.setAttribute("aria-expanded", String(willOpen));
      detailToggle.textContent = willOpen ? "收合詳細分類" : "展開詳細分類";
    });
    exportData.addEventListener("click", downloadPeopleJson);
    detailFilters.addEventListener("change", (event) => {
      if (!event.target.matches("input[type='checkbox']")) return;
      const key = event.target.dataset.filterKey;
      if (!selectedFilters[key]) return;
      if (event.target.checked) selectedFilters[key].add(event.target.value);
      else selectedFilters[key].delete(event.target.value);
      render();
    });
    cardStage.addEventListener("pointerdown", (event) => {
      if (reorderMode) return;
      cardPointers.set(event.pointerId, cardPoint(event));
      if (cardPointers.size > 1) clearCardDragState();
      if (cardPointers.size > 1 || !event.target.closest(".person")) {
        cardStage.setPointerCapture(event.pointerId);
      }
      cardGestureMoved = false;
      startCardGesture();
    });
    cardStage.addEventListener("pointermove", (event) => {
      if (reorderMode) return;
      if (!cardPointers.has(event.pointerId)) return;
      if (dragState?.dragging && dragState.pointerId === event.pointerId) return;
      if (cardZoom.scale > 1 || cardPointers.size > 1) event.preventDefault();
      cardPointers.set(event.pointerId, cardPoint(event));
      updateCardGesture();
    });
    cardStage.addEventListener("pointerup", (event) => {
      if (reorderMode) return;
      cardPointers.delete(event.pointerId);
      startCardGesture();
    });
    cardStage.addEventListener("pointercancel", (event) => {
      if (reorderMode) return;
      cardPointers.delete(event.pointerId);
      startCardGesture();
    });
    cardStage.addEventListener("dblclick", () => {
      if (!reorderMode) resetCardZoom();
    });
    window.addEventListener("resize", refreshCardLayout);
    window.addEventListener("orientationchange", () => {
      refreshCardLayout();
      setTimeout(refreshCardLayout, 250);
    });
    photoStage.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      photoStage.setPointerCapture(event.pointerId);
      photoPointers.set(event.pointerId, stagePoint(event));
      photoGestureMoved = false;
      startPhotoGesture();
    });
    photoStage.addEventListener("pointermove", (event) => {
      if (!photoPointers.has(event.pointerId)) return;
      event.preventDefault();
      photoPointers.set(event.pointerId, stagePoint(event));
      updatePhotoGesture();
    });
    photoStage.addEventListener("pointerup", (event) => {
      photoPointers.delete(event.pointerId);
      if (!photoPointers.size && !photoGestureMoved) {
        suppressCardClickUntil = Date.now() + 500;
        dialog.close();
        return;
      }
      startPhotoGesture();
    });
    photoStage.addEventListener("pointercancel", (event) => {
      photoPointers.delete(event.pointerId);
      startPhotoGesture();
    });
    photoStage.addEventListener("dblclick", resetPhotoZoom);

    async function loadPeople() {
      status.textContent = "資料載入中...";
      try {
        const response = await fetch(peopleDataUrl, { cache: "default" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("people data is not an array");
        people = data;
        restoreSortState();
        applySavedEdits();
        renderDetailFilters();
        render();
      } catch (error) {
        console.error("Failed to load people data", error);
        grid.innerHTML = "";
        empty.textContent = "資料載入失敗，請重新整理";
        empty.style.display = "block";
        status.textContent = "資料載入失敗";
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register(`sw.js?v=${encodeURIComponent(dataVersion)}`).catch((error) => {
          console.warn("Service worker registration failed", error);
        });
      });
    }

    loadPeople();
  </script>
</body>
</html>
